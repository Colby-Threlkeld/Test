<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Globe bottom half -->
  <path d="M15 58 Q15 82 50 82 Q85 82 85 58" stroke="#5a8b5d" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Globe latitude lines -->
  <path d="M17 65 Q50 70 83 65" stroke="#5a8b5d" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M20 74 Q50 80 80 74" stroke="#5a8b5d" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- Globe longitude curves -->
  <path d="M50 58 Q38 68 40 82" stroke="#5a8b5d" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M50 58 Q62 68 60 82" stroke="#5a8b5d" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- Flat base line -->
  <line x1="15" y1="58" x2="85" y2="58" stroke="#5a8b5d" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Stem -->
  <line x1="50" y1="58" x2="50" y2="36" stroke="#5a8b5d" stroke-width="3" stroke-linecap="round"/>

  <!-- Left leaf -->
  <path d="M50 44 Q36 34 30 22 Q44 26 50 44Z" fill="#5a8b5d" opacity="0.85"/>
  <!-- Left leaf vein -->
  <path d="M50 44 Q40 33 30 22" stroke="#3b5d40" stroke-width="1" stroke-linecap="round"/>

  <!-- Right leaf -->
  <path d="M50 38 Q64 26 72 14 Q58 20 50 38Z" fill="#5a8b5d"/>
  <!-- Right leaf vein -->
  <path d="M50 38 Q61 26 72 14" stroke="#3b5d40" stroke-width="1" stroke-linecap="round"/>

  <!-- Sparkles -->
  <g opacity="0.55" stroke="#93ba93" stroke-width="1.5" stroke-linecap="round">
    <!-- Top sparkle -->
    <line x1="50" y1="8" x2="50" y2="14"/>
    <line x1="47" y1="11" x2="53" y2="11"/>
    <!-- Right sparkle -->
    <line x1="72" y1="28" x2="72" y2="32"/>
    <line x1="70" y1="30" x2="74" y2="30"/>
    <!-- Left sparkle -->
    <line x1="30" y1="36" x2="30" y2="40"/>
    <line x1="28" y1="38" x2="32" y2="38"/>
  </g>

  <!-- Smiley face on globe -->
  <g stroke="#5a8b5d" stroke-width="2" stroke-linecap="round">
    <!-- Eyes -->
    <line x1="42" y1="67" x2="42" y2="70"/>
    <line x1="58" y1="67" x2="58" y2="70"/>
    <!-- Smile -->
    <path d="M44 74 Q50 78 56 74"/>
  </g>
</svg>
